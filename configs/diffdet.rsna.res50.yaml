_BASE_: "Base-DiffusionDet.yaml"
MODEL:
  WEIGHTS: "detectron2://ImageNetPretrained/torchvision/R-50.pkl"
  RESNETS:
    DEPTH: 50
    STRIDE_IN_1X1: False
  DiffusionDet:
    NUM_PROPOSALS: 500
    NUM_CLASSES: 1
    SAMPLE_STEP: 5
DATASETS:
  TRAIN: ("rsna_train",)
  TEST:  ("rsna_val",)
SOLVER:
  IMS_PER_BATCH: 32
  BASE_LR: 0.00008
  STEPS: (2000, 2500)
  MAX_ITER: 3000
  WARMUP_ITERS: 100
INPUT:
  CROP:
    ENABLED: True
  FORMAT: "RGB"
