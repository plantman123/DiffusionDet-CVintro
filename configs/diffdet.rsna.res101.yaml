_BASE_: "Base-DiffusionDet.yaml"
MODEL:
  WEIGHTS: "models/torchvision-R-101.pkl"
  RESNETS:
    DEPTH: 50
    STRIDE_IN_1X1: False
  DiffusionDet:
    NUM_PROPOSALS: 500
    NUM_CLASSES: 1
DATASETS:
  TRAIN: ("rsna_train",)
  TEST:  ("rsna_val",)
SOLVER:
  IMS_PER_BATCH: 64
  BASE_LR: 0.00015
  STEPS: (9000, 11000)
  MAX_ITER: 10000
  WARMUP_ITERS: 200
INPUT:
  CROP:
    ENABLED: True
  FORMAT: "RGB"
